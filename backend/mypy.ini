[mypy]
# Enable strict type checking for better type safety
strict = false

# Allow missing imports for third-party libraries without type hints
ignore_missing_imports = true

# Disallow untyped function definitions
disallow_untyped_defs = true

# Check unannotated function bodies
check_untyped_defs = true

# Treat Optional and None types strictly
strict_optional = false

# Warn about unused configurations in this file
warn_unused_configs = true

# Exclude irrelevant directories (e.g., virtual environments, migrations, etc.)
exclude = ^(\.venv|\.env|build|dist|migrations)/

# Files to check (include app and tests directories)
files = src/**/*.py, tests/**/*.py

[mypy-fastapi.*]
# FastAPI modules may lack type hints, so ignore missing imports
ignore_missing_imports = true

[mypy-pydantic.*]
# Pydantic models often use dynamic attributes, so allow them
ignore_missing_imports = true
allow_untyped_globals = true

[mypy-sqlalchemy.*]
# Enable SQLAlchemy plugin for better ORM type checking
plugins = sqlalchemy.ext.mypy.plugin

[mypy-alembic.*]
# Alembic-specific modules may lack type hints, so ignore missing imports
ignore_missing_imports = true
