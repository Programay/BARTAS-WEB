name: CI Pipeline
on: [push, pull_request]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: $(cat backend/.python-version)

      - name: Install dependencies
        run: pip install ruff mypy

      - name: Run Ruff (linting)
        run: ruff check .

      - name: Run Mypy (type checking)
        run: mypy backend/src/  # Adjust path to your source

      - name: Run tests
        run: pytest backend/