name: CI Pipeline
on: [push]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.get-python-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"

      - name: Set up Python
        run: uv python install
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --all-extras --dev

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: Install Ruff
        run: pip install ruff

      - name: Run linter
        run: ruff check .

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: Install requirements
        run: |
          pip install mypy
          pip install types-python-jose  # Install missing stubs
          pip install -e backend/.  # Install project dependencies

      - name: Run type checker
        run: mypy backend/src/ --config-file backend/mypy.ini

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Run tests
        run: uv run pytest backend/tests/
