name: CI Pipeline
on: [push]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.get-python-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Python version
        id: get-python-version
        run: echo "version=$(cat backend/.python-version)" >> $GITHUB_OUTPUT

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"

      - name: Run linter
        run: uvx ruff check .

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"

      - name: Install dependencies
        run: |
          cd backend
          uv pip compile --group dev --quiet --generate-hashes -o requirements.txt pyproject.toml
          uv pip install --no-cache --system -r requirements.txt
          uv add --dev \
            sqlalchemy2-stubs \
            types-python-jose \
            types-passlib

      - name: Run type checker
        run: |
          mypy backend/src/ \
            --config-file backend/pyproject.toml \
            --python-version ${{ needs.setup.outputs.python-version }}

  test:
    needs: setup
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: some_dummy_key
      JWT_REFRESH_SECRET_KEY: some_dummy_key
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ needs.setup.outputs.python-version }}

      - name: Set up Python path
        run: echo "PYTHONPATH=${{ github.workspace }}/backend/src" >> $GITHUB_ENV

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"

      - name: Install dependencies
        run: |
          cd backend
          uv pip compile --group dev --quiet --generate-hashes -o requirements.txt pyproject.toml
          uv pip install --no-cache --system -r requirements.txt

      - name: Run tests
        run: pytest backend/tests/