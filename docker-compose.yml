services:
  db:
    image: postgres:15.5
    ports:
      - "5432:${POSTGRES_PORT}"
    env_file:
      - ".env"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ".env"
    ports:
      - "${BE_PORT}:${BE_PORT}"
    volumes:
      - "./backend:/backend"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ".env"
    ports:
      - "${FE_PORT}:${FE_PORT}"
    volumes:
      - './frontend/:/frontend/'
      - '/frontend/node_modules'
volumes:
  postgres_data:
