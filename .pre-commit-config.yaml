repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.2
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types: [ file ]
        types_or: [ ts, tsx, vue ]
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.47.0
    hooks:
    -   id: eslint
        exclude: ^node_modules/
